[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "shaurya-research"
version = "0.2.0"
description = "Shaurya feature engineering, statistical research, and daily reports"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0,<2.3",
  "scipy>=1.14,<2",
  "shaurya-data>=0.2.0",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.15",
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  "ruff>=0.11",
]
jepa = [
  "scikit-learn>=1.6",
  "torch>=2.6",
]
alpha = [
  "openevolve>=0.2.27,<0.3",
  "scikit-learn>=1.7,<2",
]

[project.scripts]
shaurya-ofi-dashboard = "shaurya.cli.ofi_dashboard:main"
shaurya-live-ofi-studies = "shaurya.cli.live_ofi_studies:main"
shaurya-rolling-c8 = "shaurya.cli.rolling_c8:main"
shaurya-surface-dashboard = "shaurya.cli.surface_dashboard:main"
shaurya-feature-selection-experiment = "shaurya.cli.feature_selection_experiment:main"
shaurya-daily-research = "shaurya.analytics.post_close_alpha_research:main"
shaurya-research = "shaurya.cli.research:main"
shaurya-intraday-volatility-experiment = "shaurya.cli.intraday_volatility_experiment:main"
shaurya-intraday-alpha-tournament = "shaurya.cli.intraday_alpha_tournament:main"
shaurya-paper-alpha-scan = "shaurya.cli.paper_alpha_scan:main"
shaurya-parallel-alpha-research = "shaurya.cli.parallel_alpha_research:main"
shaurya-openevolve-alpha = "shaurya.cli.openevolve_alpha:main"
shaurya-rolling-gap-validation = "shaurya.cli.rolling_gap_validation:main"

[tool.uv.sources]
shaurya-data = { path = "../data", editable = true }

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["shaurya.analytics", "shaurya.cli", "shaurya.signals", "shaurya.surfaces"]

[[tool.mypy.overrides]]
module = ["pandas", "pandas.*", "scipy", "scipy.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["sklearn", "sklearn.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["shaurya.research.intraday_volatility"]
disable_error_code = ["no-untyped-call"]
