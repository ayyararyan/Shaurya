{
  "registry_type": "features",
  "version": "microstructure_features_v1",
  "frozen": true,
  "availability_rule": "available_ts_ns <= anchor_ts_ns",
  "instrument_tick_sizes": {"NIFTY_FUTURES": 0.05},
  "taxonomy": {
    "ORDER_FLOW": ["OFI"],
    "BOOK_GEOMETRY": ["imbalance", "spread", "depth"],
    "LIQUIDITY_PRESSURE": ["activity", "realised_move"],
    "OPTIONS_SURFACE": ["skew_innovation"],
    "REGIME": ["causal_state"]
  },
  "templates": [
    {
      "feature_id_pattern": "ofi.cumulative.depth={depth}.window={window}s",
      "family": "ORDER_FLOW/OFI",
      "axes": {
        "depth": [1, 5, 10, 20, 50, 100, 200],
        "window": [1, 2, 5, 10, 20, 30, 60, 120, 300]
      },
      "object_category": "deterministically_derived",
      "timing_rule": "past-only window ending at anchor",
      "source": "canonical DAT CCZ OFI"
    }
  ],
  "features": [
    {"feature_id": "book.spread_ticks", "family": "BOOK_GEOMETRY", "timing_rule": "as-of anchor"},
    {"feature_id": "book.depth_imbalance_l5", "family": "BOOK_GEOMETRY", "timing_rule": "as-of anchor"},
    {"feature_id": "book.log1p_l1_depth", "family": "BOOK_GEOMETRY", "timing_rule": "as-of anchor"},
    {"feature_id": "regime.trailing_volatility", "family": "REGIME", "timing_rule": "strictly trailing"},
    {"feature_id": "regime.trailing_activity", "family": "REGIME", "timing_rule": "strictly trailing"},
    {"feature_id": "regime.minutes_from_open", "family": "REGIME", "timing_rule": "declared session clock"},
    {"feature_id": "control.source_keyed_ar1_phi_0_8", "family": "NEGATIVE_CONTROL", "timing_rule": "causal source/time-keyed deterministic AR(1), phi=0.8, no target input"},
    {"feature_id": "surface.front_skew_ew_innovation", "family": "OPTIONS_SURFACE", "timing_rule": "past-state EW innovation"},
    {"feature_id": "interaction.ofi_w10_d10_x_spread", "family": "ORDER_FLOW/OFI", "timing_rule": "causal product at anchor"},
    {"feature_id": "interaction.ofi_w10_d10_x_inverse_l1_depth", "family": "ORDER_FLOW/OFI", "timing_rule": "causal product at anchor"},
    {"feature_id": "interaction.ofi_w10_d10_x_trailing_volatility", "family": "ORDER_FLOW/OFI", "timing_rule": "causal product at anchor"},
    {"feature_id": "interaction.front_skew_innovation_x_ofi_w10_d10", "family": "OPTIONS_SURFACE", "timing_rule": "causal product at anchor"}
  ]
}
