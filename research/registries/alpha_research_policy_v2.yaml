  ],
  "robustness": {
    "require_complete_surface": true,
    "isolated_spike_penalty": 0.5,
    "block_bootstrap": true,
    "block_bootstrap_replicates": 199,
    "block_bootstrap_mean_length": 8.0,
    "block_bootstrap_seed": 20260827
  }
}
