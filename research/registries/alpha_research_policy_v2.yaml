{
  "registry_type": "policy",
  "version": "alpha_research_policy_v2",
  "frozen": true,
  "permitted_model_classes": ["ridge", "elastic_net"],
  "selection_methods": ["family_shrinkage", "nested_past_only"],
  "training_windows_sessions": [20],
  "training_cadences_seconds": [1],
  "sampling_clocks": ["calendar_1s"],
  "pooling_coordinates": ["instrument"],
  "selection_thresholds": [0.15],
  "validation": {"minimum_inner_sessions": 5, "scheme": "expanding"},
  "outer_test": {"sessions_per_block": 1, "purge_seconds": 60, "embargo_seconds": 60},
  "minimum_evidence": {"observations": 120, "effective_sample_size": 60, "sessions_for_provisional": 5, "sessions_for_stable": 20, "outer_folds_for_stable": 5},
  "multiplicity": {"method": "benjamini_yekutieli", "fdr": 0.05, "family_level": true},
  "promotion": {"minimum_sign_consistency": 0.7, "minimum_neighbor_robustness": 0.5, "minimum_adjusted_evidence": 0.95, "minimum_abs_score": 0.005, "single_day_promotion": false, "three_session_features_are_shadow_only": true},
  "decay": {"weakening_ratio": 0.5, "decaying_consecutive_sessions": 3, "dormant_consecutive_sessions": 5},
