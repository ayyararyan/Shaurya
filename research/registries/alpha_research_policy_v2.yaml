  "null_simulation": {"method": "circular_shift", "minimum_shift_blocks": 2, "replicates": 199, "seed": 20260827, "statistic": "maximum_absolute_score", "rerun_complete_miner": true},
  "regime_rules": {
    "causal_only": true,
    "history_seconds": 900,
    "minimum_prior_observations": 120,
    "exclude_current_from_thresholds": true,
    "same_connection_epoch": true,
    "minimum_bucket_observations": 50,
    "definitions": {
      "global": {"strategy": "always"},
      "diagnostic_only": {"strategy": "always", "live_weight": 0}
