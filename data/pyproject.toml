[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "shaurya-data"
version = "0.2.0"
description = "Shaurya market-data collection, validation, cataloguing, and replay"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "dhanhq>=2.2,<3",
  "numpy>=2.0,<2.3",
  "pandas>=2.2,<4",
  "pydantic>=2.10,<3",
  "scipy>=1.14,<2",
  "websockets>=15,<18",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.15",
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  "ruff>=0.11",
]

[project.scripts]
shaurya-data = "shaurya.data_cli.main:main"
shaurya-dhan-capture = "shaurya.data_cli.capture_dhan:main"
shaurya-chain-capture = "shaurya.data_cli.capture_chain:main"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[tool.setuptools.package-data]
shaurya = ["py.typed"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["shaurya.contracts", "shaurya.data", "shaurya.data_cli"]

[[tool.mypy.overrides]]
module = ["dhanhq", "dhanhq.*", "pandas", "pandas.*", "scipy", "scipy.*"]
ignore_missing_imports = true
